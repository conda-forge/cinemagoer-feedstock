{% set name = "cinemagoer" %}
{% set version = "2026.6.27" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/cinemagoer-{{ version }}.tar.gz
  sha256: 0520db0e199cf4cecac79bedba92db797eb5ac553dc8ec183930ca1fbd4e91b2

build:
  entry_points:
    - imdbpy = imdb.cli:main
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - lxml
    - python >={{ python_min }}
    - sqlalchemy

test:
  imports:
    - imdb
  commands:
    - pip check
    - imdbpy --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://cinemagoer.github.io/
  summary: Python package to access the IMDb's database
  description: |
    Cinemagoer is a Python package useful to retrieve and manage the data of the IMDb (to which we are not affiliated in any way) movie database about movies, people, characters and companies
  license: GPL-2.0-or-later
  dev_url: https://github.com/cinemagoer/cinemagoer
  doc_url: https://cinemagoer.readthedocs.io/
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - HeavyTony2
