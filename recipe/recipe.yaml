schema_version: 1

context:
  name: cinemagoer
  version: "2026.8.20"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/cinemagoer-${{ version }}.tar.gz
  sha256: 99b99fe30582ddbfb08db0dd8af712bd55c11da7c3155e07a19ac6b5ecd677aa

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - imdbpy = imdb.cli:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - lxml >=6.1.1
    - python >=${{ python_min }}
  run_constraints:
    - sqlalchemy >=2.0.51,<2.1

tests:
  - python:
      imports:
        - imdb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - imdbpy --help

about:
  summary: Python package to access the IMDb's database
  description: |
    Cinemagoer is a Python package useful to retrieve and manage the data of the IMDb (to which we are not affiliated in any way) movie database about movies, people, characters and companies
  license: GPL-2.0-only
  license_file:
    - LICENSE.txt
  homepage: https://cinemagoer.github.io/
  repository: https://github.com/cinemagoer/cinemagoer
  documentation: https://cinemagoer.readthedocs.io/

extra:
  recipe-maintainers:
    - HeavyTony2
